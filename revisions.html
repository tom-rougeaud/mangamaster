/* ═══ MANGA MASTER — direction « temple japonais » (commune à toutes les pages)
   Laque vermillon et filet d’or (en-tête, motif de vagues seigaiha), papier washi (grain et fibres, UNIQUEMENT sur le fond de page :
   les cartes, questions et réponses restent à plat pour la lisibilité), encre sumi, indigo, sceau (hanko).
   Le jaune d’or vif (--bulb) est réservé à ce qui s’allume (réponses, gagnant·e·s, chrono).
   Tout est piloté par des VARIABLES : 10 thèmes (html[data-theme]) × 3 jeux de polices (html[data-font]).
   Les couleurs « -l » (fond clair), « -t » (texte sur fond clair), « -d » (foncé) et « -b » (bordure)
   sont DÉRIVÉES de la couleur de base par color-mix : un thème ne définit que sa palette de base.
   Polices : Hina Mincho (titres), Noto Serif JP, Murecho — toutes contrôlées : macrons (Shōnen, Dōjō), accents français, « », œ.
   Tailles en rem (le zoom A− / A+ agit sur la taille de base). */

  --night:#14110F;--night2:#3A1410;   /* décompte plein écran (fond sombre dans tous les thèmes) */
  /* dérivées (ne pas redéfinir dans un thème) */
  --violet-d:color-mix(in srgb,var(--violet) 76%,#000);--violet-l:color-mix(in srgb,var(--violet) 14%,var(--card));--violet-t:color-mix(in srgb,var(--violet) 42%,var(--ink));--violet-b:color-mix(in srgb,var(--violet) 38%,var(--card));
  --coral-d:color-mix(in srgb,var(--coral) 76%,#000);--coral-l:color-mix(in srgb,var(--coral) 14%,var(--card));--coral-t:color-mix(in srgb,var(--coral) 42%,var(--ink));--coral-b:color-mix(in srgb,var(--coral) 38%,var(--card));
  --sun-d:color-mix(in srgb,var(--sun) 76%,#000);--sun-l:color-mix(in srgb,var(--sun) 18%,var(--card));--sun-t:color-mix(in srgb,var(--sun) 40%,var(--ink));--sun-b:color-mix(in srgb,var(--sun) 45%,var(--card));
  --mint-d:color-mix(in srgb,var(--mint) 76%,#000);--mint-l:color-mix(in srgb,var(--mint) 15%,var(--card));--mint-t:color-mix(in srgb,var(--mint) 42%,var(--ink));--mint-b:color-mix(in srgb,var(--mint) 38%,var(--card));
  --sky-d:color-mix(in srgb,var(--sky) 76%,#000);--sky-l:color-mix(in srgb,var(--sky) 14%,var(--card));--sky-t:color-mix(in srgb,var(--sky) 42%,var(--ink));--sky-b:color-mix(in srgb,var(--sky) 38%,var(--card));
  --pink-d:color-mix(in srgb,var(--pink) 76%,#000);--pink-l:color-mix(in srgb,var(--pink) 14%,var(--card));--pink-t:color-mix(in srgb,var(--pink) 42%,var(--ink));
  --hl:color-mix(in srgb,var(--violet) var(--tm),var(--ink));   /* texte accentué (bleu) */
  --hl-c:color-mix(in srgb,var(--coral) var(--tm),var(--ink));  /* texte rouge */
  --hl-m:color-mix(in srgb,var(--mint) var(--tm),var(--ink));   /* texte vert */
  --bulb-l:color-mix(in srgb,var(--bulb) 22%,var(--card));
  --glow:color-mix(in srgb,var(--bulb) 55%,transparent);
  --good:var(--mint);--bad:var(--coral);
  --grid:transparent;
  --s1:color-mix(in srgb,var(--shc) 9%,transparent);--s2:color-mix(in srgb,var(--shc) 16%,transparent);--s3:color-mix(in srgb,var(--shc) 32%,transparent);
  --ov:color-mix(in srgb,var(--shc) 62%,transparent);
  --frame:inset 0 0 0 3px var(--card),inset 0 0 0 4px color-mix(in srgb,var(--gold) 50%,var(--card));  /* liseré d’or intérieur (panneau de fusuma) */
  --r:6px;--r-sm:4px;--r-lg:8px;
  --sh:0 1px 0 var(--s2),0 8px 20px var(--s1);
  --sh-lg:0 18px 50px var(--s3);
  /* polices (jeu « temple » par défaut) : titres Hina Mincho, texte Murecho */
  --f:"Murecho",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;   /* texte courant */
  --fh:"Hina Mincho","Noto Serif JP",serif;                                  /* titres */
  --fu:"Murecho",system-ui,sans-serif;                                       /* boutons, étiquettes */
  --fn:"Noto Serif JP","Hina Mincho",serif;                                  /* chiffres (score, chrono) */
  --fw:500;--fhw:400;--fb:1.02;
  --fz:1;
}

#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='24' cy='12' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='24' cy='12' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='72' cy='12' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='72' cy='12' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='72' cy='12' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='72' cy='12' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='120' cy='12' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='120' cy='12' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='120' cy='12' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='120' cy='12' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='-48' cy='24' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='-48' cy='24' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='-48' cy='24' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='-48' cy='24' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='0' cy='24' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='0' cy='24' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='0' cy='24' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='0' cy='24' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='48' cy='24' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='48' cy='24' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='48' cy='24' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='48' cy='24' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='96' cy='24' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='96' cy='24' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='96' cy='24' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='96' cy='24' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='-24' cy='36' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='-24' cy='36' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='-24' cy='36' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='-24' cy='36' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='24' cy='36' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='24' cy='36' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='24' cy='36' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='24' cy='36' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='72' cy='36' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='72' cy='36' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='72' cy='36' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='72' cy='36' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='120' cy='36' r='24' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='120' cy='36' r='17.3' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='120' cy='36' r='11.0' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3Ccircle cx='120' cy='36' r='4.8' fill='#0B1A12' stroke='#285A3C' stroke-width='1.1'/%3E%3C/svg%3E");
}
/* ───────── 3. les jeux de polices ───────── */
html[data-font="temple"]{}
html[data-font="kyoto"]{--fh:"Noto Serif JP","Hina Mincho",serif;--f:"Noto Serif JP","Hina Mincho",serif;--fu:"Murecho","Noto Serif JP",system-ui,sans-serif;--fn:"Noto Serif JP",serif;--fw:500;--fhw:800;--fb:1}
html[data-font="lisible"]{--fh:"Murecho",system-ui,sans-serif;--f:"Murecho",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fu:"Murecho",system-ui,sans-serif;--fn:"Murecho",system-ui,sans-serif;--fw:400;--fhw:800;--fb:1.02}
/* ───────── 4. base ───────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--fz) * var(--fit,1) * var(--dz,1) * var(--fb,1));-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{font-family:var(--f);font-weight:var(--fw);color:var(--ink);line-height:1.4;background-color:var(--bg);
  background-image:var(--tex);background-size:260px 260px;font-variant-numeric:lining-nums tabular-nums}
/* taches d’encre et vignette : calque fixe derrière la page (un fond « fixed » coûte cher sur mobile) */
body:before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background-image:var(--vig),var(--blot)}
h1,h2,h3{margin:0;font-family:var(--fh);font-weight:var(--fhw);letter-spacing:.01em;line-height:1.18}
a{color:var(--lk)}
button,input,select,textarea{font-family:inherit;font-weight:inherit;color:inherit;font-size:.9rem}
button,.btn,.tag,.chip,.pill,.seg button,.vsw button,.zoom button,.badge{font-family:var(--fu)}
button{cursor:pointer;font-weight:700}
.hidden{display:none!important}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
:focus-visible{outline:3px solid var(--bulb);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--bulb) 55%,transparent)}

/* ─ en-tête (toujours visible) : bandeau de cuir doré ─ */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem 1rem;
  background:var(--veil);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--ink);font-family:var(--fh);font-weight:var(--fhw);font-size:1.25rem;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:2.1rem;height:2.1rem;flex:none}
.brand b{color:var(--hl)}.brand i{font-style:normal;color:var(--hl-c)}
.brand small{font-family:var(--fu);font-weight:700;font-size:.72rem;color:var(--ink2);background:var(--violet-l);border:1px solid var(--violet-b);border-radius:var(--pill);padding:.12rem .55rem;margin-left:.15rem}
.top .sp{flex:1}
.tools{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.zoom{display:inline-flex;border-radius:var(--pill);background:var(--chip);padding:.2rem}
.zoom button{border:0;background:transparent;border-radius:var(--pill);min-width:2.3rem;height:2.1rem;font-weight:800;font-size:.95rem;color:var(--hl)}
.zoom button:hover{background:var(--card)}
.zoom span{display:inline-flex;align-items:center;font-size:.72rem;color:var(--ink2);padding:0 .15rem;min-width:2.4rem;justify-content:center}
.vsw{display:inline-flex;border-radius:var(--pill);background:var(--chip);padding:.2rem}
.vsw button{border:0;background:transparent;border-radius:var(--pill);padding:.35rem .8rem;font-weight:700;font-size:.8rem;color:var(--ink2)}
.vsw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px var(--s2),inset 0 -2px 0 var(--gold)}
.ibtn{border:0;background:var(--chip);color:var(--ink2);border-radius:var(--pill);height:2.3rem;min-width:2.3rem;padding:0 .8rem;font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;gap:.35rem}
.ibtn:hover{background:color-mix(in srgb,var(--chip) 80%,var(--ink));color:var(--ink)}
.ibtn svg{width:1.1rem;height:1.1rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;border-radius:var(--pill);padding:.3rem .8rem;font-weight:700;font-size:.8rem;background:var(--card);border:1px solid var(--line2)}
.pill i{width:.6rem;height:.6rem;border-radius:50%;background:var(--ink3);display:inline-block}
.pill.ok i{background:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 25%,transparent)}
.pill.ko i{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 25%,transparent)}
.pill.wait i{background:var(--sun);animation:blink 1s infinite}

/* ─ boutons : cuir et cire ─ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--r-sm);padding:.65rem 1.15rem;font-weight:700;font-size:.95rem;letter-spacing:.02em;
  background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line2),0 3px 8px var(--s1);border:1.5px solid var(--line2);transition:transform .08s,box-shadow .15s,background .15s;user-select:none;-webkit-user-select:none;text-decoration:none;line-height:1.15}
.btn:not(.btn-go):not(.btn-primary):not(.btn-mint):not(.btn-coral):not(.btn-soft):not(.btn-ghost):hover{background:var(--tint);border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.3)}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn-primary{background:var(--violet);color:var(--on);border-color:var(--violet-d);box-shadow:0 2px 0 var(--violet-d),0 4px 10px color-mix(in srgb,var(--violet) 30%,transparent)}
.btn-primary:hover{background:var(--violet-d)}
.btn-go{background:var(--go);color:var(--go-t);border-color:var(--gold);box-shadow:0 0 0 2px var(--go),0 5px 16px var(--s3)}
.btn-go svg{color:var(--bulb)}
.btn-go:hover{background:color-mix(in srgb,var(--go) 88%,var(--bulb))}
.btn-go.pulse svg{animation:bulbon 2.4s ease-in-out infinite}
.btn-mint{background:var(--mint);color:var(--on);border-color:var(--mint-d);box-shadow:0 2px 0 var(--mint-d)}
.btn-coral{background:var(--coral);color:var(--on);border-color:var(--coral-d);box-shadow:0 2px 0 var(--coral-d)}
.btn-soft{background:var(--violet-l);color:var(--violet-t);border-color:transparent;box-shadow:none}
.btn-soft:hover{background:color-mix(in srgb,var(--violet) 22%,var(--card))}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2)}
.btn-ghost:hover{background:var(--chip);color:var(--ink)}
.btn-big{font-size:1.1rem;padding:.85rem 1.5rem;border-radius:var(--r)}
.btn-xl{font-size:1.35rem;padding:1rem 2rem;border-radius:var(--r-lg)}
.btn-sm{font-size:.82rem;padding:.4rem .75rem;border-radius:9px}
.btn-block{width:100%}

/* ─ cartes, puces, champs ─ */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--frame),var(--sh);padding:1.3rem;border:1px solid var(--line2);background-image:var(--tex);background-size:260px 260px}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:var(--pill);padding:.28rem .8rem;font-weight:700;font-size:.82rem;background:var(--violet-l);color:var(--violet-t);border:1px solid var(--violet-b)}
.tag{display:inline-block;border-radius:6px;padding:.08rem .45rem;font-size:.7rem;font-weight:700;letter-spacing:.03em;background:var(--violet-l);color:var(--violet-t);vertical-align:middle}
.tag.t-sun{background:var(--sun-l);color:var(--sun-t)}.tag.t-mint{background:var(--mint-l);color:var(--mint-t)}.tag.t-coral{background:var(--coral-l);color:var(--coral-t)}.tag.t-sky{background:var(--sky-l);color:var(--sky-t)}
.tag.t-pink{background:var(--pink-l);color:var(--pink-t)}
.tag.t-dark{background:var(--night);color:#E8CC73;border:1px solid var(--gold);letter-spacing:.05em}
.inp,select.inp,textarea.inp{width:100%;border:2px solid var(--line2);background:var(--bg2);border-radius:var(--r-sm);padding:.6rem .8rem;font-size:1.05rem;font-weight:600;color:var(--ink);transition:border-color .15s,box-shadow .15s;box-shadow:inset 0 2px 3px var(--s1)}
.inp::placeholder{color:var(--ink3);opacity:1}
.inp:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 22%,transparent)}
textarea.inp{resize:vertical;line-height:1.45}
label.lbl{display:block;font-family:var(--fu);font-weight:700;font-size:.82rem;margin:.6rem 0 .3rem;color:var(--ink2);letter-spacing:.03em}
.warn{background:var(--sun-l);border:2px solid var(--sun-b);border-radius:var(--r-sm);padding:.7rem .9rem;color:var(--sun-t)}
.info{background:var(--sky-l);border:2px solid var(--sky-b);border-radius:var(--r-sm);padding:.7rem .9rem;color:var(--sky-t)}
.err{background:var(--coral-l);border:2px solid var(--coral-b);border-radius:var(--r-sm);padding:.7rem .9rem;color:var(--coral-t)}
.okbox{background:var(--mint-l);border:2px solid var(--mint-b);border-radius:var(--r-sm);padding:.7rem .9rem;color:var(--mint-t)}
code,kbd{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.88em;background:var(--violet-l);border-radius:6px;padding:.05rem .35rem}
.src-note{display:block;margin:.5rem 0 0;padding:.35rem .7rem;border-left:3px solid var(--gold);background:var(--tint);border-radius:0 8px 8px 0;font-size:.85rem;font-style:italic;color:var(--ink2)}

/* ─ contrôle segmenté et interrupteur ─ */
.seg{display:inline-flex;flex-wrap:wrap;gap:.25rem;background:var(--chip);border-radius:13px;padding:.25rem}
.seg button{border:0;background:transparent;border-radius:10px;padding:.5rem .85rem;font-weight:700;font-size:.88rem;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px var(--s2),inset 0 -2px 0 var(--gold)}
.sw{display:inline-flex;align-items:center;gap:.6rem;cursor:pointer;font-weight:700;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:2.8rem;height:1.6rem;border-radius:var(--pill);background:var(--line2);position:relative;transition:background .2s;flex:none;box-shadow:inset 0 1px 3px var(--s2)}
.sw i:after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#FBF3DE;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw input:checked+i{background:var(--mint)}
.sw input:checked+i:after{transform:translateX(1.2rem)}
.sw input:focus-visible+i{outline:3px solid var(--bulb);outline-offset:2px}

/* ─ accordéons ─ */
details.acc{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px var(--s1);margin:.6rem 0;overflow:hidden;border:1px solid var(--line2)}
details.acc>summary{list-style:none;cursor:pointer;padding:.85rem 1rem;font-family:var(--fu);font-weight:700;display:flex;align-items:center;gap:.6rem}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"";margin-left:auto;width:.6rem;height:.6rem;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(45deg);transition:transform .2s;flex:none}
details.acc[open]>summary:after{transform:rotate(225deg)}
details.acc>.acc-b{padding:0 1rem 1rem}

/* ─ fenêtres ─ */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:var(--ov);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow:auto;animation:fade .15s}
.modal.hidden{display:none}
.modal>.box{background:var(--card);background-image:var(--tex);border-radius:var(--r-lg);box-shadow:var(--frame),var(--sh-lg);border:1px solid var(--gold);width:100%;max-width:46rem;padding:1.3rem 1.4rem;position:relative;animation:pop .25s}
.modal>.box.wide{max-width:64rem}
.modal .x{position:absolute;top:.8rem;right:.8rem;border:0;background:var(--chip);border-radius:50%;width:2.3rem;height:2.3rem;font-size:1.1rem;font-weight:800;color:var(--ink2)}
.modal h2{font-size:1.4rem;margin:0 2.5rem .8rem 0}
.toast{position:fixed;left:50%;top:4.6rem;transform:translateX(-50%);z-index:200;background:var(--ink);color:var(--bg);border:1px solid var(--gold);border-radius:var(--pill);padding:.65rem 1.3rem;font-family:var(--fu);font-weight:700;box-shadow:var(--sh-lg);animation:pop .25s;max-width:90vw;text-align:center}
.toast.ok{background:var(--mint-d);color:var(--on)}.toast.ko{background:var(--coral-d);color:var(--on)}

/* ─ pied de page ─ */
.foot{text-align:center;padding:1.4rem 1rem 2rem;font-size:.88rem;color:var(--ink2)}
.foot a{color:var(--ink2);font-weight:700;margin:0 .5rem;text-decoration:none;border-bottom:2px solid var(--line2)}
.foot a:hover{color:var(--hl);border-color:var(--gold)}

/* ─ formules (KaTeX conservé : peut servir pour une future série « alchimie ») ─ */
.katex{font-size:1.08em}
.katex-display{margin:.3em 0}

/* ─ réponses A B C D : couleurs d’enluminures ─ */
.a0{--ac:var(--a0);--ad:color-mix(in srgb,var(--a0) 76%,#000);--al:color-mix(in srgb,var(--a0) 14%,var(--card));--at:var(--on)}
.a1{--ac:var(--a1);--ad:color-mix(in srgb,var(--a1) 76%,#000);--al:color-mix(in srgb,var(--a1) 14%,var(--card));--at:var(--on)}
.a2{--ac:var(--a2);--ad:color-mix(in srgb,var(--a2) 76%,#000);--al:color-mix(in srgb,var(--a2) 14%,var(--card));--at:var(--on)}
.a3{--ac:var(--a3);--ad:color-mix(in srgb,var(--a3) 76%,#000);--al:color-mix(in srgb,var(--a3) 14%,var(--card));--at:var(--on)}
.sh{font-style:normal}

/* ─ icônes de thème (icons.js) : héritent de la couleur du texte ─ */
.tico{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.22em;flex:none;color:currentColor}
.tico.lg{width:3rem;height:3rem;vertical-align:middle}
.tico svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ─ animations ─ */
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes popin{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 4px 14px var(--s3)}50%{box-shadow:0 4px 22px var(--glow)}}
@keyframes bulbon{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px var(--bulb))}}
@keyframes lighton{0%{background:var(--unlit);box-shadow:none}40%{background:var(--gold-l)}100%{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bulb) 55%,#fff),var(--bulb) 60%,var(--gold));box-shadow:0 0 0 6px color-mix(in srgb,var(--bulb) 25%,transparent),0 0 28px 6px var(--glow)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}60%{transform:translateY(-8px)}}
@keyframes grow{from{width:0}}
@keyframes drop{0%{transform:translateY(-120%);opacity:0}70%{transform:translateY(6%);opacity:1}100%{transform:translateY(0)}}
.pop{animation:pop .3s ease both}
.popin{animation:popin .5s cubic-bezier(.2,.9,.3,1.3) both}
.shake{animation:shake .45s}
.floaty{animation:floaty 2.6s ease-in-out infinite}
.dots span{display:inline-block;width:.6rem;height:.6rem;margin:0 .2rem;border-radius:50%;background:var(--violet);animation:bounce 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--mint)}.dots span:nth-child(3){animation-delay:.3s;background:var(--bulb)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ─ effets « pop » (fx.js) ─ */
.fx-layer{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:150;overflow:hidden}
.fx-stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--fh);font-weight:var(--fhw);font-size:clamp(2rem,7vw,4.6rem);color:var(--on);padding:.3em .8em;border-radius:var(--pill);white-space:nowrap;border:3px solid var(--gold);
  box-shadow:0 12px 40px rgba(0,0,0,.35);animation:stamp 1.5s cubic-bezier(.2,.9,.3,1.3) both;display:flex;align-items:center;gap:.35em}
.fx-stamp svg{width:1.1em;height:1.1em}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(.9);opacity:0}}
.fx-bubble{position:absolute;display:flex;align-items:center;gap:.4rem;font-family:var(--fu);font-weight:700;font-size:1.05rem;color:var(--on);border-radius:var(--pill);padding:.45rem .95rem;box-shadow:0 8px 22px rgba(0,0,0,.25);animation:bubble 2.6s ease-out both;white-space:nowrap}
.fx-bubble svg{width:1.2em;height:1.2em}
@keyframes bubble{0%{transform:translateY(30px) scale(.5);opacity:0}15%{transform:translateY(0) scale(1.08);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-90px);opacity:0}}
.fx-flash{position:absolute;top:0;right:0;bottom:0;left:0;animation:flash .7s ease-out both}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.fx-pts{position:absolute;font-family:var(--fn);font-weight:900;font-size:2.4rem;color:var(--mint-t);text-shadow:0 2px 0 var(--card),0 4px 14px var(--s2);animation:ptsup 1.4s ease-out both}
@keyframes ptsup{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
canvas.fx-confetti{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:149}

/* ─ fin de partie : les médaillons accrochés à une corde (fx.js) — 3ᵉ, 2ᵉ puis 1ᵉʳ s’illuminent ─ */
.podium{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:clamp(.5rem,4vw,3rem);margin:1rem auto 0;max-width:50rem;min-height:21rem;padding-top:.7rem}
.podium .wire{position:absolute;left:4%;right:4%;top:.55rem;height:5px;border-radius:3px;background:repeating-linear-gradient(115deg,var(--gold-d) 0 4px,var(--gold) 4px 8px);box-shadow:0 2px 3px var(--s2)}
.podium .wire:before,.podium .wire:after{content:"";position:absolute;top:-.4rem;width:.85rem;height:.85rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-l),var(--gold) 60%,var(--gold-d))}
.podium .wire:before{left:-.35rem}.podium .wire:after{right:-.35rem}
.pod{flex:1;max-width:14rem;display:flex;flex-direction:column;align-items:center}
.pod .cord{width:4px;background:repeating-linear-gradient(180deg,var(--gold-d) 0 5px,var(--gold) 5px 9px);height:var(--cord,2rem)}
.pod.p1{--cord:4.2rem;--gs:clamp(5rem,13vw,7rem)}.pod.p2{--cord:2.4rem;--gs:clamp(4rem,10vw,5.4rem)}.pod.p3{--cord:1.3rem;--gs:clamp(3.6rem,9vw,4.8rem)}
.pod .bulb{display:flex;flex-direction:column;align-items:center}
.pod .cap{width:calc(var(--gs) * .22);height:calc(var(--gs) * .22);border-radius:50%;border:4px solid var(--gold-d);background:transparent;box-sizing:border-box}
.pod .glass{width:var(--gs);height:var(--gs);margin-top:-3px;border-radius:50%;background:var(--unlit);border:4px double var(--line2);box-shadow:inset 0 3px 8px var(--s2);display:flex;align-items:center;justify-content:center;font-family:var(--fn);font-weight:900;font-size:calc(var(--gs) * .42);color:var(--ink3);transition:color .3s}
.pod.show .glass{animation:lighton .8s ease-out forwards;border-color:var(--gold-d);color:var(--on-sun)}
.pod.p1.show .glass{box-shadow:0 0 0 8px color-mix(in srgb,var(--bulb) 30%,transparent),0 0 50px 14px var(--glow)}
.pod .who{text-align:center;opacity:0;transform:translateY(12px);transition:all .5s cubic-bezier(.2,.9,.3,1.3);margin-top:.7rem}
.pod.show .who{opacity:1;transform:none}
.pod .av{width:clamp(2.6rem,6vw,3.4rem);height:clamp(2.6rem,6vw,3.4rem);border-radius:50%;margin:0 auto .3rem;display:flex;align-items:center;justify-content:center;font-family:var(--fn);font-weight:900;font-size:clamp(1rem,2.4vw,1.35rem);color:var(--on);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--gold),0 3px 10px var(--s2)}
.pod .nm{font-family:var(--fh);font-weight:var(--fhw);font-size:clamp(1rem,2.4vw,1.4rem);line-height:1.1;word-break:break-word}
.pod.p1 .nm{font-size:clamp(1.15rem,2.9vw,1.7rem)}
.pod .sc{font-family:var(--fn);font-weight:700;color:var(--ink2);font-size:clamp(.85rem,1.8vw,1.05rem)}
.pod .crown{width:2.2rem;height:2.2rem;margin:0 auto .1rem;color:var(--gold);opacity:0;transform:translateY(-14px);transition:all .6s .5s cubic-bezier(.2,.9,.3,1.5);filter:drop-shadow(0 2px 2px var(--s2))}
.pod.show .crown{opacity:1;transform:none}
.pod.empty .glass{opacity:.35}
@media (max-width:480px){
  .top{gap:.35rem;padding:.45rem .55rem}
  .brand{font-size:1rem;gap:.3rem}.brand svg{width:1.7rem;height:1.7rem}.brand small{display:none}
  .zoom span{display:none}.zoom button{min-width:1.9rem;height:1.9rem;font-size:.85rem}
  .vsw button{padding:.3rem .55rem;font-size:.75rem}
  .ibtn{height:2.1rem;min-width:2.1rem;padding:0 .5rem}
  .top .tools{gap:.3rem;flex-wrap:wrap;min-width:0}   /* Cinzel est plus large que l’ancienne police : on autorise le retour à la ligne */
}
/* même réglage quand un téléphone affiche la page en « version ordinateur » (classe posée par dzCalc) */
html.narrow .top{gap:.35rem;padding:.45rem .55rem;flex-wrap:wrap}
html.narrow #brand{min-width:0;overflow:hidden;flex:0 1 auto}html.narrow .top .tools{flex:none}
html.narrow .brand{font-size:1rem;gap:.3rem}html.narrow .brand svg{width:1.7rem;height:1.7rem}html.narrow .brand small{display:none}
html.narrow .zoom span{display:none}html.narrow .zoom button{min-width:1.9rem;height:1.9rem;font-size:.85rem}
html.narrow .vsw button{padding:.3rem .55rem;font-size:.75rem}
html.narrow .ibtn{height:2.1rem;min-width:2.1rem;padding:0 .5rem}
html.narrow .top .tools{gap:.3rem;flex-wrap:wrap;min-width:0}
/* textes : jamais coupés au milieu d’un nombre ; sur les écrans ajustés, d’un seul tenant */
.katex,.katex *{overflow-wrap:normal;word-break:normal}
.nw{white-space:nowrap}
body.kwrap .nw{white-space:normal}
body.fit:not(.kwrap) .katex{white-space:nowrap}
/* écran ajusté : l’en-tête garde sa taille, la page n’impose plus de hauteur minimale */
body.fit #app{min-height:0}
body.fit .top,body.fit #foot{zoom:var(--tz,1)}

/* ═══ FORMATS DE QUESTIONS ═══
   Manga Master n’utilise que QCM, vrai/faux et curseur ; figures / tuiles / ordre sont gardés (inoffensifs) pour de futurs formats. */
.fig{display:flex;justify-content:center;margin:.6rem auto .2rem;max-width:30rem}
.figsvg{width:100%;height:auto;max-height:15rem;display:block}
.figtab{border-collapse:separate;border-spacing:0;margin:.2rem auto;font-weight:700;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px var(--line2);font-size:.95rem}
.figtab th,.figtab td{padding:.35rem .7rem;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.figtab th{background:var(--violet-l);color:var(--violet-t)}
.figtab tr:last-child td,.figtab tr:last-child th{border-bottom:0}
.figtab td:last-child,.figtab th:last-child{border-right:0}
.figcode{margin:.2rem auto;background:var(--night);color:#F1E8D2;border-radius:14px;padding:.75rem 1rem;font:700 1rem/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;text-align:left;white-space:pre;overflow-x:auto;max-width:100%;box-shadow:0 4px 0 #000}
.tile{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:2.8rem;padding:.4rem .75rem;border-radius:12px;background:var(--card);border:2px solid var(--line2);box-shadow:0 3px 0 var(--line2);font-weight:700;font-size:1.05rem;color:var(--ink);text-align:center;line-height:1.2;overflow-wrap:anywhere}
.tile.r{background:var(--bg2)}
.tl2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem 1.2rem}
.tcol{display:flex;flex-direction:column;gap:.5rem}
.pairs{display:flex;flex-direction:column;gap:.45rem}
.pair{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:.5rem}
.pair .tile{border-color:var(--pc);box-shadow:0 3px 0 var(--pc);background:var(--card)}
.pair .pa{color:var(--pc);font-weight:800;font-size:1.2rem}
.pair .ppct{font-family:var(--fn);font-weight:700;color:var(--ink2);min-width:3.2rem;text-align:right}
.orow{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;justify-content:center}
.orow .tile.ok{border-color:var(--mint);box-shadow:0 3px 0 var(--mint)}
.orow .on{display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--mint);color:var(--on);font-size:.75rem}
.osep{font-weight:800;color:var(--hl);font-size:1.3rem}
/* curseur numérique (lecture) : règle graduée */
.scale{position:relative;padding:.4rem .8rem 1.9rem;margin:.4rem 0}
.scale .sc-track{position:relative;height:.9rem;border-radius:var(--pill);background:linear-gradient(90deg,var(--sun-l),var(--chip));box-shadow:inset 0 1px 3px var(--s2),0 0 0 1px var(--line2)}
.sc-zone{position:absolute;top:-.25rem;bottom:-.25rem;background:color-mix(in srgb,var(--mint) 75%,transparent);border-radius:8px}
.sc-near{position:absolute;top:-.12rem;bottom:-.12rem;background:color-mix(in srgb,var(--sun) 45%,transparent);border-radius:8px}
.sc-ans,.sc-me{position:absolute;top:50%;width:0}
.sc-ans::before{content:"";position:absolute;left:-.55rem;top:-.95rem;width:1.1rem;height:1.9rem;border-radius:8px;background:var(--mint-d);box-shadow:0 0 0 3px var(--card)}
.sc-ans em{position:absolute;bottom:1.1rem;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-family:var(--fn);font-weight:900;background:var(--mint-d);color:var(--on);border-radius:10px;padding:.1rem .5rem;font-size:.9rem}
.sc-me::before{content:"";position:absolute;left:-.45rem;top:-.75rem;width:.9rem;height:1.5rem;border-radius:7px;background:var(--violet);box-shadow:0 0 0 3px var(--card)}
.sc-me em{position:absolute;top:1rem;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-family:var(--fn);font-weight:900;color:var(--hl);font-size:.8rem;margin-top:.9rem}
.sc-ticks{position:relative;height:1.2rem;margin-top:.35rem}
.sc-ticks span{position:absolute;transform:translateX(-50%);font-family:var(--fn);font-size:.8rem;font-weight:700;color:var(--ink2);white-space:nowrap}
.sc-u{position:absolute;right:.4rem;bottom:0;font-size:.75rem;font-weight:800;color:var(--hl)}
.sc-dots{position:relative;margin-bottom:.15rem}
.sc-dot{position:absolute;width:.62rem;height:.62rem;margin-left:-.31rem;border-radius:50%;background:var(--ink3);box-shadow:0 0 0 1.5px var(--card)}
.sc-dot.ok{background:var(--mint)}.sc-dot.pa{background:var(--sun)}.sc-dot.ko{background:var(--coral)}
.scale.big .sc-track{height:1.3rem}.scale.big .sc-ticks span{font-size:1rem}
.scale.wa .sc-dots{margin-bottom:2rem}
.scale.big .sc-dot{width:.9rem;height:.9rem;margin-left:-.45rem}
.fx-bubble.sm{top:4.6rem;bottom:auto!important;left:50%!important;right:auto!important;transform:translateX(-50%);font-size:.85rem;padding:.35rem .8rem;max-width:92vw;overflow:hidden;text-overflow:ellipsis;animation:bubblesm 2.3s ease-out both}
.fx-bubble.sm span{overflow:hidden;text-overflow:ellipsis}
@keyframes bubblesm{0%{opacity:0;margin-top:-.6rem}12%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0}}
.brand img{width:2.6rem;height:2.6rem;flex:none;object-fit:contain}
@media (max-width:640px){.brand img{width:2.2rem;height:2.2rem}}

/* ═══ NOUVEAUX COMPOSANTS MANGA MASTER ═══ */
/* ─ bandeau d’accueil (illustration + titre) ─ */
.hero-banner{position:relative;margin:.2rem auto 1.2rem;max-width:44rem;text-align:center;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--frame),var(--sh);border:1px solid var(--gold)}
.hero-banner img{display:block;width:100%;height:auto}
.hero-banner h1,.hero-banner h2{position:absolute;left:0;right:0;bottom:.6rem;color:var(--on);text-shadow:0 2px 8px rgba(0,0,0,.7)}
/* ─ grille de rangs (progression de l’élève) ─ */
.rk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.7rem;margin:.8rem 0}
.rk-card{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--frame),var(--sh);padding:.8rem .6rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.25rem}
.rk-card .tico{width:2.4rem;height:2.4rem;color:var(--hl)}
.rk-card b{font-family:var(--fh);font-weight:var(--fhw);font-size:.98rem;line-height:1.15}
.rk-card small{color:var(--ink2);font-size:.82rem}
.rk-card.on{border-color:var(--gold);background:linear-gradient(160deg,var(--bulb-l),var(--card))}
.rk-card.on .tico{color:var(--gold-d)}
.rk-card.off{opacity:.55;filter:grayscale(.7)}
/* ─ fiche de personnage ─ */
.sheet{background:var(--card);background-image:var(--tex);border:1px solid var(--gold);border-radius:var(--r-lg);box-shadow:var(--frame),var(--sh);overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:.7rem;padding:.8rem 1.1rem;background:linear-gradient(180deg,var(--night2),var(--night));color:#F4EAD0;border-bottom:3px solid var(--gold)}
.sheet-h h2,.sheet-h h3{color:#F4EAD0}
.sheet-h .tico{width:2rem;height:2rem;color:#E6C766}
.sheet-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.55rem 1.1rem;border-bottom:1px dashed var(--line2)}
.sheet-row:last-child{border-bottom:0}
.sheet-row span{color:var(--ink2)}
.sheet-row b{font-family:var(--fn);font-weight:700;color:var(--ink)}
.sheet-bar{height:.8rem;margin:.3rem 1.1rem .8rem;border-radius:var(--pill);background:var(--chip);overflow:hidden;box-shadow:inset 0 1px 3px var(--s2),0 0 0 1px var(--line2)}
.sheet-bar i{display:block;height:100%;border-radius:var(--pill);background:linear-gradient(90deg,var(--gold-d),var(--bulb));animation:grow .9s both}
.badge{display:inline-flex;align-items:center;gap:.35rem;border-radius:var(--pill);padding:.3rem .8rem .3rem .45rem;font-size:.82rem;font-weight:700;background:var(--bulb-l);color:var(--sun-t);border:1.5px solid var(--gold)}
.badge .tico{width:1.35em;height:1.35em;color:var(--gold-d)}
.badge.off{background:var(--chip);color:var(--ink3);border-color:var(--line2);filter:grayscale(1);opacity:.75}
.badge.off .tico{color:var(--ink3)}
/* ─ fenêtre « Apparence » : choix du thème et de la police ─ */
.look-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr));gap:.6rem;margin:.5rem 0 1rem}
.look-chip{--pv-bg:var(--bg);--pv-card:var(--card);--pv-ink:var(--ink);--pv-a:var(--violet);--pv-b:var(--bulb);position:relative;display:flex;flex-direction:column;align-items:stretch;gap:.35rem;padding:.45rem;border:2px solid var(--line2);border-radius:var(--r);background:var(--card);color:var(--ink);text-align:center;font-family:var(--fu);font-weight:700;font-size:.85rem;box-shadow:0 2px 0 var(--line2)}
.look-chip:hover{border-color:var(--ink3)}
.look-chip.on{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--bulb) 45%,transparent)}
.look-chip.on:after{content:"✓";position:absolute;top:-.5rem;right:-.45rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--gold);color:var(--on-sun);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-family:system-ui,sans-serif}
.look-chip .sw{display:block;position:relative;height:3.4rem;width:auto;border-radius:9px;background:var(--pv-bg);border:1px solid color-mix(in srgb,var(--pv-ink) 25%,transparent);overflow:hidden;gap:0;cursor:pointer}
.look-chip .sw:before{content:"";position:absolute;left:.4rem;right:.4rem;top:.4rem;height:1.2rem;border-radius:5px;background:var(--pv-card);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.look-chip .sw:after{content:"Aa";position:absolute;left:.7rem;top:.4rem;line-height:1.2rem;font-size:.8rem;font-weight:900;color:var(--pv-ink);background:none;width:auto;height:auto;transform:none;box-shadow:none;border-radius:0}
.look-chip .sw i{position:absolute;bottom:.4rem;width:1rem;height:.7rem;border-radius:4px;background:var(--pv-a);box-shadow:none;transition:none}

/* ═══ TEMPLE — surcouche « temple japonais » (chargée en dernier : elle l’emporte sur v11.css / prof.css / eleve.css) ═══
   – à plat sous les textes : AUCUNE texture dans les cartes, questions, réponses, fenêtres (le grain washi est réservé au fond de page)
   – angles francs (2–8 px), filets d’or, laque vermillon pour l’en-tête et l’action principale
   – pastilles et boutons : rectangles aux angles à peine adoucis (plus de « bulles ») */
:root{--code-font:"Murecho",system-ui,sans-serif;--pill:3px;
  --mode-solo:#A8241B;--mode-duel:#2B4876;--mode-boss:#5E3A7E;--pg-mj:var(--go);--pg-pl:var(--violet);
  --kin:linear-gradient(180deg,#F0D58A,#C9A04A 55%,#E3C479)}
html{scroll-behavior:smooth}
body{letter-spacing:.005em}
h1,h2,h3{letter-spacing:.03em;font-weight:400}
.jp{font-family:"MM Kanji","Noto Serif JP",serif;font-weight:800}

/* ─ en-tête : laque + vagues seigaiha + double filet d’or ─ */
html .top{background-color:var(--hdr);background-image:var(--sei);background-size:48px 48px;color:var(--hdr-ink);
  -webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0;
  box-shadow:0 2px 0 var(--hdr-gold),0 5px 0 var(--hdr),0 6px 0 color-mix(in srgb,var(--hdr-gold) 70%,transparent),0 12px 22px rgba(30,15,5,.22)}

html .top .brand small{background:#F6EDD6;color:#8F1D14;border:1px solid var(--hdr-gold);border-radius:2px;padding:.1rem .55rem;font-size:.7rem;font-weight:800;letter-spacing:.16em;margin-left:.6rem}
html .top .zoom,html .top .vsw{background:rgba(255,244,220,.10);border:1px solid rgba(230,196,110,.5);border-radius:var(--pill);padding:.15rem}

html .top .zoom button:hover,html .top .vsw button:hover{background:rgba(255,244,220,.18)}
html .top .vsw button.on{background:#F6EDD6;color:#2A1E10;box-shadow:inset 0 -2px 0 var(--hdr-gold)}
html .top .ibtn{background:rgba(255,244,220,.10);color:var(--hdr-ink);border:1px solid rgba(230,196,110,.5);border-radius:var(--pill)}

/* ─ à plat : pas de texture sous le texte ─ */
html .card,html .modal>.box,html .sheet,html .q-card,html .g-qbox,html .rules-box,html .door,html .mode,html details.acc,html .join-card .jc-url{background-image:none}

/* o = {sm:"juste"|"vite", rd:secondes de lecture} (réglages de la partie) */
function rulesHtml(mode,o){

  var M=MODES[mode],li=function(r){return '<li><span class="ri">'+ICO[r[0]]+"</span><span>"+esc(r[1])+"</span></li>";};

  if(o.rd>0)com.splice(1,0,["eye","Les propositions apparaissent après "+o.rd+" secondes : lis bien l’énoncé d’abord."]);
  if(o.fk===false)com=com.filter(function(r){return r[0]!=="target";});
  if(o.ml)com.splice(com.length-1,0,["star","Réponses multiples, ordre, association : tout juste = tous les points ; presque tout juste = une partie des points."]);
  if(o.pr)com.splice(com.length-1,0,["dice","Pari : sur une question « Pari », tu peux miser avant de répondre : points ×2 si tu as juste, −"+BET_LOSS+" points si tu te trompes."]);
  var R=RULES[mode].slice();
  if(mode==="duel"&&o.dd)R.splice(R.length-1,0,["swords","Duel direct (au plus une fois toutes les "+MANCHE+" questions) : les deux clans en tête votent pour leur champion ; le plus rapide des deux qui a juste offre "+DD_WIN+" points à son clan."]);

    if(o.hpen)R.splice(R.length-1,0,["heart","Handicap du Sensei : chaque erreur (ou absence de réponse) du Sensei abîme sa propre jauge."]);
  }
  return '<div class="rules-mode">'+esc(M.nom)+'</div><h2>Les règles</h2><div class="rules-cols"><div><h3>Ce mode</h3><ul>'+R.map(li).join("")+'</ul></div><div><h3>Les points</h3><ul>'+com.map(li).join("")+"</ul></div></div>";
}

var BANNED=["con","conne","connard","connasse","pute","salope","encule","enculé","bite","couille","merde","nique","niquer","ntm","fdp","pd","batard","bâtard","nazi","hitler","negro","negre","nègre","bougnoul","bougnoule","chienne","putain","cul","teub","zizi","enfoire","enfoiré","abruti","debile","débile","gogol","mongol"];
function normWord(s){return s.toLowerCase().normalize?s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""):s.toLowerCase();}
/* → {ok:true, p:pseudo propre} ou {ok:false, why:"…"} */
function checkPseudo(raw){
  var p=String(raw||"").replace(/\s+/g," ").replace(/'/g,"’").trim();
  if(p.length<2)return {ok:false,why:"Au moins 2 caractères."};
  if(p.length>16)return {ok:false,why:"16 caractères au maximum."};
  if(!/^[A-Za-z0-9À-ÖØ-öø-ÿŒœ _.’\-]+$/.test(p))return {ok:false,why:"Lettres, chiffres, espace, apostrophe, point, tiret ou _ uniquement."};
  var w=normWord(p).split(/[ _.\-]+/),flat=normWord(p).replace(/[^a-z0-9]/g,"");
  for(var i=0;i<BANNED.length;i++){var b=normWord(BANNED[i]);if(w.indexOf(b)>=0||(b.length>=5&&flat.indexOf(b)>=0))return {ok:false,why:"Ce nom n’est pas accepté. Choisis-en un autre."};}
  return {ok:true,p:p};
}

  function apply(){z=clamp(Math.round(z*10)/10,0.7,1.8);document.documentElement.style.setProperty("--fz",z);store.set("zoom_"+key,z);var s=host&&host.querySelector("span");if(s)s.textContent=Math.round(z*100)+" %";if(typeof FIT!=="undefined"&&FIT.on){FIT.max=FIT.base*z;fitSoon(0);}}
  if(host){
    host.innerHTML='<button type="button" data-z="-1" title="Réduire le texte" aria-label="Réduire le texte">A−</button><span>100 %</span><button type="button" data-z="1" title="Agrandir le texte" aria-label="Agrandir le texte">A+</button>';
    host.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;z+=0.1*(+b.getAttribute("data-z"));apply();});
  }
  apply();

/* ─── Ajustement automatique des écrans de jeu (v3.5) ───
   Pendant une question ou une correction, la taille de base (rem) est cherchée par dichotomie
   pour que le contenu occupe toute la fenêtre, sans défilement ni débordement horizontal.
   Les figures (SVG à viewBox) et tous les blocs étant en rem, tout grandit ou rétrécit ensemble,
   sans déformation. Le zoom A− / A+ règle la taille maximale autorisée. */
var FIT={on:false,min:0.6,max:1.9,base:1.9,T:null,busy:false};
/* Téléphone affiché en « version ordinateur » (Chrome « Site pour ordinateur », certains navigateurs intégrés) :
   la page est mise en page sur ~980 px puis réduite, tout devient minuscule. On compense par --dz. */
var DZ=1,COARSE=false;try{COARSE=window.matchMedia("(pointer:coarse)").matches;}catch(e){}
function dzCalc(){
  var d=document.documentElement,cw=d.clientWidth||window.innerWidth,sw=screen.width||cw,sh=screen.height||cw,coarse=false;
  try{coarse=window.matchMedia("(pointer:coarse)").matches;}catch(e){}
  var dev=window.innerWidth>window.innerHeight?Math.max(sw,sh):Math.min(sw,sh),z=1;
  if(coarse&&dev>0&&dev<1100&&cw>dev*1.3)z=Math.min(3.2,cw/dev);
  DZ=z;d.style.setProperty("--dz",String(Math.round(z*1000)/1000));
  d.classList.toggle("narrow",cw/z<=480);d.classList.toggle("dzon",z>1);
}
dzCalc();
function fitSet(f){var d=document.documentElement.style;d.setProperty("--fit",String(Math.round(f*1000)/1000));d.setProperty("--tz",String(f>1?Math.round(1000/f)/1000:1));}
function visible(e){return !!(e&&e.getClientRects().length);}
/* une formule (KaTeX) dépasse-t-elle du bloc qui la contient (ou de l’écran) ? */
function fitKatexCut(){
  var ks=document.querySelectorAll(".katex"),W=document.documentElement.clientWidth;
  for(var i=0;i<ks.length;i++){
    var k=ks[i];if(!visible(k))continue;var r=k.getBoundingClientRect();if(!r.width)continue;
    if(r.right>W+1||r.left<-1)return true;
    var c=k.parentElement;
    while(c&&c!==document.body){var cs=getComputedStyle(c);if(cs.display.indexOf("inline")!==0)break;c=c.parentElement;}
    if(c&&c!==document.body){var cr=c.getBoundingClientRect();if(r.right>cr.right+2||r.left<cr.left-2)return true;}
  }
  return false;
}
function fitOverflows(){
  var d=document.documentElement,b=document.body,h=window.innerHeight,w=d.clientWidth||window.innerWidth;
  if(Math.max(d.scrollHeight,b.scrollHeight)>h+1||Math.max(d.scrollWidth,b.scrollWidth)>w+1)return true;
  var xs=document.querySelectorAll("[data-fit]");
  for(var i=0;i<xs.length;i++){var e=xs[i];if(visible(e)&&(e.scrollHeight>e.clientHeight+1||e.scrollWidth>e.clientWidth+1))return true;}
  return fitKatexCut();
}
function fitSearch(){
  var lo=FIT.min,hi=Math.max(FIT.min,FIT.max),best=lo;
  fitSet(hi);
  if(!fitOverflows())best=hi;
  else for(var i=0;i<9;i++){var mid=(lo+hi)/2;fitSet(mid);if(fitOverflows())hi=mid;else{lo=mid;best=mid;}}
  fitSet(best*0.985);return best;
}
function fitNow(){
  clearTimeout(FIT.T);
  var b=document.body;
  if(!FIT.on){fitSet(1);b.classList.remove("fit","kwrap");return;}
  if(FIT.busy)return;FIT.busy=true;
  var sy=window.scrollY;b.classList.add("fit");b.classList.remove("kwrap");
  if(FIT.unfill)FIT.unfill();
  if(FIT.pre)FIT.pre();
  var A=fitSearch();
  /* formule longue : si la garder d’un seul tenant oblige à trop réduire (ou si elle dépasse encore),
     on autorise la coupure aux signes = + − × (jamais au milieu d’un nombre) */
  if(fitKatexCut()){b.classList.add("kwrap");fitSearch();}
  else if(A<FIT.max*0.95&&[].some.call(document.querySelectorAll(".katex"),visible)){
    b.classList.add("kwrap");var K=fitSearch();
    if(A>=K*0.8){b.classList.remove("kwrap");fitSet(A*0.985);if(fitOverflows())fitSearch();}
  }
  /* place restante en bas : la page la répartit (réponses plus hautes, contenu centré) */
  if(FIT.fill){var mn=document.querySelector("main")||b,gap=window.innerHeight-(mn.getBoundingClientRect().bottom+parseFloat(getComputedStyle(mn).marginBottom||0));if(gap>8){FIT.fill(gap-6);if(fitOverflows()&&FIT.unfill)FIT.unfill();}}
  window.scrollTo(0,sy);FIT.busy=false;
}
function fitSoon(ms){clearTimeout(FIT.T);FIT.T=setTimeout(fitNow,ms===undefined?30:ms);clearTimeout(FIT.T2);FIT.T2=setTimeout(function(){if(FIT.on)fitNow();},850);}
/* on = écran ajusté ; o = {min, max} */
function fitScreen(on,o){
  FIT.on=!!on;if(o){if(o.min)FIT.min=o.min;if(o.max)FIT.base=o.max;}
  var z=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fz"))||1;FIT.max=FIT.base*z;
  if(!on){fitSet(1);document.body.classList.remove("fit","kwrap");return;}
  fitNow();fitSoon(250);
  clearTimeout(FIT.T2);FIT.T2=setTimeout(function(){if(FIT.on)fitNow();},850);   /* après les animations (secousse, apparition) */
}
/* le contenu d’un écran change (apprenti(e) qui arrive, correction, liste…) : on réajuste ; les simples changements de texte (chrono) sont ignorés */
function fitWatch(root){
  if(!root||!window.MutationObserver)return;
  new MutationObserver(function(ms){
    if(!FIT.on||FIT.busy)return;
    for(var i=0;i<ms.length;i++){var m=ms[i],n=[].slice.call(m.addedNodes).concat([].slice.call(m.removedNodes));
      for(var j=0;j<n.length;j++)if(n[j].nodeType===1){fitSoon(60);return;}
      if(m.type==="attributes"&&m.attributeName==="class"&&/(^| )hidden( |$)/.test(String(m.oldValue||""))!==m.target.classList.contains("hidden")){fitSoon(60);return;}}
  }).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:["class"],attributeOldValue:true});
}
function typing(){var a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=="checkbox"&&a.type!=="radio"&&a.type!=="range");}
window.addEventListener("resize",function(){dzCalc();if(FIT.on&&!(typing()&&COARSE))fitSoon(120);});
window.addEventListener("orientationchange",function(){setTimeout(dzCalc,200);if(FIT.on)fitSoon(300);});
try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(FIT.on)fitSoon(0);});}catch(e){}

/* ─── Sons (synthétisés, aucun fichier) ─── */
var SND=(function(){
  var ctx=null,muted=false;
  function ac(){if(!ctx){try{var C=window.AudioContext||window.webkitAudioContext;if(C)ctx=new C();}catch(e){}}if(ctx&&ctx.state==="suspended"){try{ctx.resume();}catch(e){}}return ctx;}
  function tone(f,d,type,vol,when,slide){
    var c=ac();if(!c||muted)return;var t=c.currentTime+(when||0);
    var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);
  }
  return {
    unlock:function(){ac();},
    setMute:function(m){muted=!!m;},isMuted:function(){return muted;},
    tick:function(){tone(880,0.06,"square",0.05);},
    tock:function(){tone(660,0.08,"square",0.06);},
    pop:function(){tone(520,0.12,"sine",0.15,0,980);},
    good:function(){tone(660,0.12,"triangle",0.2);tone(880,0.14,"triangle",0.2,0.1);tone(1320,0.22,"triangle",0.18,0.2);},
    bad:function(){tone(300,0.18,"sawtooth",0.1);tone(220,0.3,"sawtooth",0.1,0.15);},
    bolt:function(){tone(1200,0.18,"sine",0.12,0,2400);},
    whoosh:function(){tone(200,0.35,"triangle",0.08,0,900);},
    go:function(){tone(523,0.12,"triangle",0.2);tone(659,0.12,"triangle",0.2,0.12);tone(784,0.3,"triangle",0.22,0.24);},
    hit:function(){tone(150,0.2,"square",0.14,0,60);},
    fanfare:function(){[523,659,784,1047,784,1047].forEach(function(f,i){tone(f,i===5?0.6:0.16,"triangle",0.2,i*0.15);});},
    drum:function(n){for(var i=0;i<(n||10);i++)tone(110+Math.random()*30,0.07,"square",0.07,i*0.09);}
  };
})();

/* ─── Rendu du texte : échappé, retours à la ligne conservés (plus de formules) ─── */
function rt(s){return esc(s).replace(/\n/g,"<br>");}
/* texte brut (pour les exports CSV) */
function plain(s){return String(s||"");}

/* points d’une bonne réponse : 500 à 1000 selon la vitesse (ou 1000 en mode « justesse seule ») + bonus de série */
function ptsFor(t,dur,streak,mode){
  var base=mode==="juste"?1000:Math.round(500+500*(1-clamp(t/dur,0,1)));
  return base+(streak>=2?Math.min(streak-1,5)*50:0);
}

/* ═══════════════════════════════════════════════════════════════
   BASE DE DONNÉES SUPABASE (salles, joueurs, historique) + TEMPS RÉEL
   La bibliothèque supabase-js est intégrée au fichier : aucun CDN.
═══════════════════════════════════════════════════════════════ */
var NET={sb:null};
function lmConfig(){
  var c=(typeof MANGA_CONFIG!=="undefined")?MANGA_CONFIG:null;
  if(!c||!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY)return null;
  var u=String(c.SUPABASE_URL).trim(),k=String(c.SUPABASE_ANON_KEY).trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in|net)\/?$/i.test(u)&&!/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$/.test(u))return {bad:"url",url:u};
  if(k.length<30)return {bad:"key",url:u};
  return {url:u.replace(/\/+$/,""),key:k};
}
function lmClient(){
  if(NET.sb)return NET.sb;
  var c=lmConfig();if(!c||c.bad)return null;
  if(!window.supabase||!window.supabase.createClient)return null;
  NET.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:50}}});
  return NET.sb;
}
function rpc(fn,args,timeout){
  return new Promise(function(res,rej){
    var sb=lmClient();if(!sb)return rej(new Error("config"));
    var done=false,t=setTimeout(function(){if(!done){done=true;rej(new Error("timeout"));}},timeout||12000);
    sb.rpc(fn,args||{}).then(function(r){
      if(done)return;done=true;clearTimeout(t);
      if(r.error)rej(r.error);else res(r.data);
    },function(e){if(done)return;done=true;clearTimeout(t);rej(e);});
  });
}
function netErrText(e){
  var m=String((e&&(e.message||e.details||e.hint||e.code))||e||"");
  if(m==="config")return "Connexion à la base non configurée (fichier config.js).";
  if(m==="timeout")return "La base ne répond pas : vérifiez la connexion Internet.";
  if(/mm_|function|PGRST202|Could not find/i.test(m))return "Les fonctions de la base sont absentes : relancez le script manga_master.sql dans Supabase.";
  if(/Invalid API key|JWT|apikey|401/i.test(m))return "Clé Supabase refusée : vérifiez SUPABASE_ANON_KEY dans config.js.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Impossible de joindre Supabase : adresse incorrecte, réseau filtré ou projet en pause.";
  return "Erreur de la base : "+m.slice(0,140);
}
/* Canal temps réel d’une salle : diffusion de messages éphémères (rien n’est stocké).
   onStatus("up"|"down") ; à chaque (re)connexion, « up » est rappelé. */
function openChannel(code,onMsg,onStatus){
  return new Promise(function(resolve,reject){
    var sb=lmClient();if(!sb)return reject(new Error("config"));
    var ch=sb.channel("mm1-"+code,{config:{broadcast:{self:false,ack:false}}}),first=true,closed=false;
    ch.on("broadcast",{event:"m"},function(p){try{onMsg(p.payload);}catch(e){if(window.console)console.error(e);}});
    var api={
      send:function(m){if(closed)return;try{var r=ch.send({type:"broadcast",event:"m",payload:m});if(r&&r.catch)r.catch(function(){});}catch(e){}},
      close:function(){closed=true;try{sb.removeChannel(ch);}catch(e){}}
    };
    var to=setTimeout(function(){if(first){first=false;reject(new Error("timeout"));}},15000);
    ch.subscribe(function(status){
      if(status==="SUBSCRIBED"){
        if(first){first=false;clearTimeout(to);resolve(api);}
        if(onStatus)onStatus("up");
      }else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
        if(onStatus&&!closed)onStatus("down");
      }
    });
  });
}

/* ─── Glisser-déposer universel (souris, doigt, stylet) ───
   o = {root, item, handle?, zone, onDrop(item, zone, before), onTap?(item), sort?:bool} */
var DRAGGING=false;
function dragDrop(o){
  var st=null;
  function cleanup(){
    if(!st)return;
    if(st.ghost)st.ghost.remove();
    st.it.classList.remove("dragging");
    $$(".over",document).forEach(function(z){z.classList.remove("over");});
    $$(".drop-before",document).forEach(function(z){z.classList.remove("drop-before");});
    st=null;setTimeout(function(){DRAGGING=false;},0);
    window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",cancel);
  }
  function target(x,y){
    var el=document.elementFromPoint(x,y),z=el&&el.closest(o.zone),before=null;
    if(z&&o.sort){
      var items=$$(o.item,z).filter(function(n){return n!==st.it;});
      for(var i=0;i<items.length;i++){var r=items[i].getBoundingClientRect();if(y<r.top+r.height/2){before=items[i];break;}}
    }
    return {z:z,before:before};
  }
  function mv(e){
    if(!st||e.pointerId!==st.id)return;
    var dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.ghost){
      if(dx*dx+dy*dy<64)return;
      DRAGGING=true;
      st.ghost=st.it.cloneNode(true);st.ghost.classList.add("drag-ghost");st.ghost.style.width=st.it.offsetWidth+"px";
      document.body.appendChild(st.ghost);st.it.classList.add("dragging");
    }
    e.preventDefault();
    st.ghost.style.left=e.clientX+"px";st.ghost.style.top=e.clientY+"px";
    var t=target(e.clientX,e.clientY);
    $$(".over",document).forEach(function(z){if(z!==t.z)z.classList.remove("over");});
    $$(".drop-before",document).forEach(function(z){if(z!==t.before)z.classList.remove("drop-before");});
    if(t.z)t.z.classList.add("over");
    if(t.before)t.before.classList.add("drop-before");
  }
  function up(e){
    if(!st||e.pointerId!==st.id)return;
    var it=st.it,was=!!st.ghost,t=was?target(e.clientX,e.clientY):null;
    cleanup();
    if(was){if(t.z&&o.onDrop)o.onDrop(it,t.z,t.before);}
    else if(o.onTap)o.onTap(it,e);
  }
  function cancel(){cleanup();}
  o.root.addEventListener("pointerdown",function(e){
    if(e.button)return;
    var it=e.target.closest(o.item);if(!it||!o.root.contains(it))return;
    if(o.handle&&!e.target.closest(o.handle))return;
    if(!o.handle&&e.target.closest("button,input,select,textarea,a"))return;
    st={it:it,x:e.clientX,y:e.clientY,id:e.pointerId,ghost:null};
    window.addEventListener("pointermove",mv,{passive:false});window.addEventListener("pointerup",up);window.addEventListener("pointercancel",cancel);
  });
}

function pwaInit(){
  try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  if(standalone||store.get("pwa_no",0))return;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  function bar(html,onInstall){
    if($("pwa-bar"))return;
    var d=document.createElement("div");d.id="pwa-bar";
    d.innerHTML='<img src="'+(typeof LOGO_URI!=="undefined"?LOGO_URI:"")+'" alt=""><span>'+html+'</span>'+(onInstall?'<button type="button" class="btn btn-go" id="pwa-ok">Installer</button>':"")+'<button type="button" class="btn btn-ghost" id="pwa-no">Plus tard</button>';
    document.body.appendChild(d);
    $("pwa-no").addEventListener("click",function(){store.set("pwa_no",Date.now());d.remove();});
    if(onInstall)$("pwa-ok").addEventListener("click",function(){onInstall();d.remove();});
  }
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();PWA_EVT=e;
    bar("Installe <b>Manga Master</b> sur ton appareil : accès direct, plein écran.",function(){PWA_EVT.prompt();});});
  if(ios)setTimeout(function(){bar("Sur iPhone / iPad : touche <b>Partager</b> puis <b>Sur l’écran d’accueil</b> pour installer Manga Master.",null);},2500);
}

(function(){
"use strict";
function $(i){return document.getElementById(i);}
var D=JSON.parse(document.getElementById("mm-rv").textContent),FULL=!!D.full;
var TYPES=[["c","QCM"],["v","Vrai ou faux"],["s","Curseur"],["i","Intrus"],["h","Texte à trous"],["w","Qui suis-je ?"],["m","Réponses multiples"],["o","Remettre dans l’ordre"],["a","Association"]];
var TN={};TYPES.forEach(function(t){TN[t[0]]=t[1];});
var LV={1:"★ Débutant",2:"★★ Initié",3:"★★★ Expert"};
var ROY={},TH={},LOAD={},PAGE=60;
D.roy.forEach(function(r){ROY[r.id]=r;r.th=[];});
D.th.forEach(function(t){TH[t.id]=t;if(ROY[t.roy])ROY[t.roy].th.push(t);if(t.Q)prep(t);});
var ft="",fl=0,query="",shown=PAGE;
function nf(n){return Number(n).toLocaleString("fr-FR");}
function norm(s){s=String(s||"").toLowerCase();return s.normalize?s.normalize("NFD").replace(/[̀-ͯ]/g,""):s;}
function prep(t){
  if(t.ready)return;t.ready=true;
  t.Q.forEach(function(q){q.src=(t.S&&t.S[q.s])||"";q.th=t.id;
    q._b=norm([q.q,(q.c||[]).join(" "),(q.d||[]).join(" "),q.x,q.src,t.nom].join(" | "));});
}
/* ─── chargement d’un thème (page de l’app) ─── */
function load(id){
  var t=TH[id];if(t.Q)return Promise.resolve(t);
  if(LOAD[id])return LOAD[id];
  LOAD[id]=fetch("q/"+id+".json?v="+encodeURIComponent(MM_VERSION)).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(j){t.Q=j.Q;t.S=j.S;prep(t);return t;}).catch(function(e){delete LOAD[id];throw e;});
  return LOAD[id];
}
/* ─── statistiques ─── */
function total(f){return D.th.reduce(function(s,t){return s+f(t);},0);}
var NQ=total(function(t){return t.nb;});
function bars(rows,col){
  var mx=Math.max.apply(null,rows.map(function(r){return r.n;}))||1;
  return rows.map(function(r){return '<div class="bar"><span class="nm" title="'+esc(r.nm)+'">'+esc(r.nm)+'</span><span class="tr"><i style="width:'+Math.max(1,Math.round(100*r.n/mx))+'%;--c:'+(r.c||col)+'"></i></span><span class="n">'+nf(r.n)+'</span></div>';}).join("");
}
function renderStats(){
  $("big").innerHTML='<span class="chip"><b>'+nf(NQ)+'</b> questions</span><span class="chip"><b>'+nf(D.th.length)+'</b> thèmes</span><span class="chip"><b>'+nf(D.roy.length)+'</b> Univers</span>';
  var byR=D.roy.map(function(r){return {nm:r.court||r.nom,n:r.th.reduce(function(s,t){return s+t.nb;},0),c:r.couleur};});
  var byT=TYPES.map(function(t){return {nm:t[1],n:total(function(x){return (x.st&&x.st[t[0]])||0;})};});
  var byL=[1,2,3].map(function(l){return {nm:LV[l],n:total(function(x){return (x.lv&&x.lv[l-1])||0;})};});
  $("stats").innerHTML='<div class="card"><h3>Par Univers</h3>'+bars(byR,"var(--violet)")+'</div><div class="card"><h3>Par type de question</h3>'+bars(byT,"var(--sky,var(--violet))")+'</div><div class="card"><h3>Par niveau</h3>'+bars(byL,"var(--mint)")+'</div>';
}
/* ─── affichage d’une question ─── */
function hl(s,terms){
  s=esc(s);if(!terms.length)return s;
  terms.forEach(function(w){if(w.length<2)return;var re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");s=s.replace(re,"<mark>$1</mark>");});
  return s;
}
function ansHtml(q,H){
  var c=q.c||[],h=function(x){return H(String(x));},o=function(x,ok){return '<div class="o'+(ok?" ok":"")+'">'+h(x)+"</div>";},k;
  switch(q.t){
    case "c":case "w":return c.map(function(x,i){return o(x,i===q.r);}).join("");
    case "i":return c.map(function(x,i){return o(x+(i===q.r?" (l’intrus)":""),i===q.r);}).join("");
    case "h":return c.map(function(x,i){return o(x,i===q.r);}).join("");
    case "v":return o(q.r?"Vrai":"Faux",true);
    case "m":return c.map(function(x,i){return o(x,q.r.indexOf(i)>=0);}).join("");
    case "o":return "<ol>"+c.map(function(x){return "<li>"+h(x)+"</li>";}).join("")+"</ol>";
    case "a":return c.map(function(x,i){return '<div class="pr"><div class="o">'+h(x)+"</div><b>→</b><div class=\"o ok\">"+h(q.d[i])+"</div></div>";}).join("");
    case "s":k=nf(q.r)+(q.u?" "+q.u:"");
      return '<div class="o ok">'+h(k)+'</div><div class="o">Curseur de '+nf(q.mn)+" à "+nf(q.mx)+(q.p?", pas de "+nf(q.p):"")+(q.tl?", tolérance ± "+nf(q.tl):"")+"</div>";
  }
  return "";
}
function qHtml(q,terms,withTh){
  var t=TH[q.th],H=function(s){return hl(s,terms);},stem=String(q.q);
  if(q.t==="h"&&stem.indexOf("____")>=0)stem=stem.replace("____","____");
  return '<article class="q"><div class="qm"><span class="tag">'+TN[q.t]+'</span><span class="tag t-sun">'+LV[q.n]+'</span>'+(withTh?'<span class="tag t-theme" style="--tc:'+(ROY[t.roy]?ROY[t.roy].couleur:"#666")+'">'+esc(t.nom)+"</span>":"")+'<span class="qid">'+esc(q.i)+'</span></div>'+
    '<div class="qt">'+H(stem).replace(/\n/g,"<br>")+'</div><div class="qa">'+ansHtml(q,H)+'</div>'+
    (q.x?'<div class="qx">'+H(q.x)+"</div>":"")+(q.src?'<div class="qs">Source : '+H(q.src)+"</div>":"")+"</article>";
}
function okF(q){return (!ft||q.t===ft)&&(!fl||q.n===fl);}
/* ─── arbre Univers › thème › type ─── */
function chips(t){
  return TYPES.filter(function(x){return t.st&&t.st[x[0]];}).map(function(x){return '<span class="tag">'+x[1]+" · "+nf(t.st[x[0]])+"</span>";}).join("")+
    [1,2,3].filter(function(l){return t.lv&&t.lv[l-1];}).map(function(l){return '<span class="tag t-sun">'+LV[l]+" · "+nf(t.lv[l-1])+"</span>";}).join("");
}
function renderTree(){
  $("tree").innerHTML=D.roy.map(function(r){
    var n=r.th.reduce(function(s,t){return s+t.nb;},0);
    return '<details class="roy" style="--c:'+r.couleur+'" data-r="'+r.id+'"><summary>'+esc(r.nom)+'<span class="cnt">'+nf(r.th.length)+" thèmes · "+nf(n)+" q.</span></summary><div class=\"roy-b\">"+
      r.th.map(function(t){return '<details class="th" data-id="'+t.id+'"><summary>'+esc(t.nom)+(t.dk?' <span class="tag t-dark">mature</span>':"")+'<span class="cnt">'+nf(t.nb)+' q.</span></summary><div class="th-b"></div></details>';}).join("")+"</div></details>";
  }).join("");
}
function fillTheme(d){
  var id=d.getAttribute("data-id"),t=TH[id],b=d.querySelector(".th-b");
  if(!t.Q){b.innerHTML='<p class="muted">Chargement…</p>';load(id).then(function(){fillTheme(d);},function(){b.innerHTML='<p class="muted">Chargement impossible : vérifiez la connexion.</p>';});return;}
  var h='<div class="th-st">'+chips(t)+"</div>",n=0;
  TYPES.forEach(function(ty){
    var qs=t.Q.filter(function(q){return q.t===ty[0]&&okF(q);});if(!qs.length)return;n+=qs.length;
    h+='<h4 class="ty">'+ty[1]+"<span>"+nf(qs.length)+" q.</span></h4>"+qs.map(function(q){return qHtml(q,[],false);}).join("");
  });
  b.innerHTML=n?h:h+'<p class="muted">Aucune question avec ces filtres.</p>';
}
$("tree").addEventListener("toggle",function(e){var d=e.target;if(d.matches&&d.matches("details.th")&&d.open&&!d.querySelector(".th-b .q")&&!d.getAttribute("data-f"))fillTheme(d);},true);
function refreshOpen(){[].slice.call(document.querySelectorAll("details.th[open]")).forEach(fillTheme);}
/* ─── recherche ─── */
function allLoaded(){return D.th.every(function(t){return t.Q;});}
function loadAll(cb){
  if(allLoaded()){cb();return;}
  var done=0,N=D.th.length,fail=0;
  $("info").textContent="Chargement des thèmes… 0 / "+N;
  D.th.forEach(function(t){load(t.id).then(function(){done++;},function(){fail++;done++;}).then(function(){
    $("info").textContent="Chargement des thèmes… "+done+" / "+N;
    if(done===N){if(fail)$("info").textContent=fail+" thème(s) n’ont pas pu être chargés : vérifiez la connexion.";cb();}});});
}
function search(){
  var terms=norm(query).split(/\s+/).filter(Boolean),raw=query.trim().split(/\s+/).filter(Boolean);
  if(!terms.length){$("res").classList.add("hid");$("tree").classList.remove("hid");$("info").textContent="";return;}
  $("tree").classList.add("hid");$("res").classList.remove("hid");
  var tok=++SEQ;
  loadAll(function(){
    if(tok!==SEQ)return;
    var out=[];D.th.forEach(function(t){if(t.Q)t.Q.forEach(function(q){if(okF(q)&&terms.every(function(w){return q._b.indexOf(w)>=0;}))out.push(q);});});
    var shownN=Math.min(out.length,shown);
    $("info").textContent=out.length?nf(out.length)+" question"+(out.length>1?"s":"")+" trouvée"+(out.length>1?"s":"")+(out.length>shownN?" · "+nf(shownN)+" affichées":""):"Aucune question trouvée.";
    $("res").innerHTML=out.slice(0,shownN).map(function(q){return qHtml(q,raw,true);}).join("")+(out.length>shownN?'<div class="more"><button type="button" class="btn btn-soft" id="more">Afficher '+nf(Math.min(PAGE,out.length-shownN))+' de plus</button></div>':"");
  });
}
var SEQ=0,TM=null;
$("q").addEventListener("input",function(){query=this.value;shown=PAGE;clearTimeout(TM);TM=setTimeout(search,200);});
$("res").addEventListener("click",function(e){if(e.target.id==="more"){shown+=PAGE;search();}});
/* ─── filtres ─── */
function renderFilters(){
  $("ft").innerHTML='<button type="button" data-v=""'+(ft?"":' class="on"')+">Tous</button>"+TYPES.map(function(t){return '<button type="button" data-v="'+t[0]+'"'+(ft===t[0]?' class="on"':"")+">"+t[1]+"</button>";}).join("");
  $("fl").innerHTML='<button type="button" data-v="0"'+(fl?"":' class="on"')+">Tous</button>"+[1,2,3].map(function(l){return '<button type="button" data-v="'+l+'"'+(fl===l?' class="on"':"")+">"+LV[l]+"</button>";}).join("");
}
$("ft").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;ft=b.getAttribute("data-v");shown=PAGE;renderFilters();refreshOpen();search();});
$("fl").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;fl=+b.getAttribute("data-v");shown=PAGE;renderFilters();refreshOpen();search();});
$("fold").addEventListener("click",function(){[].slice.call(document.querySelectorAll("#tree details[open]")).forEach(function(d){d.open=false;});});
/* ─── démarrage ─── */
$("brand").outerHTML=brandHtml("révisions",FULL?"#":"index.html");
$("foot").innerHTML=footHtml();
initZoom("revisions",$("zoom"));
renderStats();renderFilters();renderTree();
})();
</script>
</body>
</html>
